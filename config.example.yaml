# llama_proxy 配置文件

server:
  listen_addr: ":9091"
  data_dir: "./data"
  # 允许访问 /_proxy/ui 面板的 Host 白名单（忽略端口与大小写）。
  # 留空则不限制。配置后，Host 不在列表内的请求访问面板返回 403。
  ui_allowed_hosts:
    - "llm.youcd.online"

database:
  type: "sqlite"  # sqlite 或 postgresql
  sqlite:
    path: "proxy.db"
  postgresql:
    dsn: "postgres://user:password@localhost:5432/proxy?sslmode=disable"
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime_seconds: 300

backends:
  strategy: "wrr"  # wrr, swrr, wr, rr, random
  list:
    - name: "gpu-server-1"
      url: "http://gpu-server-1:8080"
      weight: 50
      enabled: true
      model: "qwen"          # 该后端实际部署的模型 ID，转发时自动重写请求体的 model 字段
      api_key: "secret-1"    # 该后端的 API Key，转发时自动注入 Authorization: Bearer <key>
      # tags: ["fast"]       # 可选：加入的路由标签池，routing 规则按 pool 标签选择后端；
                              # 含 "tool_call" 即加入 tool_call 子池
    - name: "gpu-server-2"
      url: "http://gpu-server-2:8080"
      weight: 30
      enabled: true
      model: "deepseek"      # 该后端实际部署的模型 ID
      api_key: "secret-2"    # 该后端的 API Key
    - name: "cpu-server"
      url: "http://cpu-server:8080"
      weight: 20
      enabled: true

# 路由规则（可选）：按客户端特征把请求固定到指定标签池，规则按顺序评估、首条命中生效；
# 未配置时不存在路由规则，全部流量走默认池。
# header 内每个请求头都必须匹配（AND）：User-Agent 采用包含匹配（不区分大小写的子串包含），
# 其余请求头 trim 后精确相等、区分大小写。
# 命中规则的请求：只从 pool 标签对应的后端子池（tags 含该标签）中选择，
# 请求失败时自动转移到子池内下一个后端。
#routing:
#  rules:
#    - name: "goclaw"                      # 规则名，仅用于日志与报错
#      header:
#        User-Agent: "GoClaw"             # User-Agent 包含该子串即命中（不区分大小写）
#      pool: "tool_call"                   # 只路由到 tags 含 "tool_call" 的后端
#    - name: "agent-x"                     # 多条件 AND：两个请求头都必须完全匹配
#      header:
#        User-Agent: "AgentX/1.0"
#        X-Agent-Env: "prod"
#      pool: "fast"

proxy:
  retention_days: 14  # 数据保留天数；0 表示永久保留（不做清理），未配置默认 14
  max_request_bytes: 33554432  # 32MB
  max_capture_bytes: 33554432  # 32MB
  request_timeout_seconds: 600
  poll_backend_metrics: true
  poll_interval_seconds: 10
  # 白名单：仅命中这些路径的请求被转发记录，其余一律 404（精确或前缀匹配）。
  # 默认白名单为 OpenAI 兼容接口，未配置时生效。
  record_paths:
    - "/v1/chat/completions"
    - "/v1/completions"
    - "/v1/embeddings"

# 进程调度（可选）：配置后启用"模型 ID 驱动的模型进程切换"，未配置则保持纯转发模式。
# 条目以模型 ID 为 key（key 即模型 ID，小写生效）：请求该模型 ID 时切换到对应进程。
# 同一时刻只有一个本地进程在运行（共享端口）；coding 条目为按需模型（空闲租约到期
# 切回默认 background），background 条目为常驻模型（启动时加载，就绪后作为动态节点
# 入代理池参与负载均衡）。coding/background 条目均可多个；多个 background 时必须
# 指定 default 作为常驻默认。lease/switch/default 为保留 key，不得用作模型 ID。
# 所有模型 ID（backends.list 与 scheduling）必须全局唯一，启动时校验，重复则拒绝启动。
