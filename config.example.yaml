# 非 coding 流量统一进入代理池（backends.list + 本地 background 节点，后者就绪时入池参与
# 负载均衡，未就绪时出池）。所有模型 ID（backends.list 与 scheduling）必须全局唯一，
# 启动时校验，重复则拒绝启动。
